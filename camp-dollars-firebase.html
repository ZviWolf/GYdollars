<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>$GY Counter</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    padding-bottom: 100px;
  }
  header {
    position: sticky;
    top: 0;
    background: #1e293b;
    padding: 16px 20px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    border-bottom: 1px solid #334155;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .subtitle {
    font-size: 12px;
    font-weight: 400;
    color: #94a3b8;
    margin-top: 2px;
  }
  #logoutBtn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: #334155;
    border: none;
    color: #f1f5f9;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
  }
  #list {
    padding: 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  .camper {
    background: #1e293b;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .info {
    flex: 1;
    min-width: 0;
  }
  .name {
    font-size: 17px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .count {
    font-size: 14px;
    color: #4ade80;
    font-weight: 700;
    margin-top: 2px;
  }
  .btns {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  button.step {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    font-weight: 700;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.minus { background: #ef4444; }
  button.plus { background: #22c55e; }
  button.del {
    background: none;
    border: none;
    color: #64748b;
    font-size: 18px;
    padding: 4px 8px;
  }
  #addBar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    max-width: 600px;
    margin: 0 auto;
  }
  #newName {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 16px;
  }
  #addBtn {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: #3b82f6;
    color: white;
    font-weight: 700;
    font-size: 16px;
  }
  .empty {
    text-align: center;
    color: #64748b;
    padding: 40px 20px;
  }
  .status {
    text-align: center;
    font-size: 12px;
    color: #64748b;
    padding: 6px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal {
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
  }
  .modal h3 {
    margin: 0 0 8px 0;
    font-size: 17px;
  }
  .modal p {
    margin: 0 0 12px 0;
    font-size: 14px;
    color: #94a3b8;
  }
  .modal input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 16px;
    margin-bottom: 12px;
  }
  .modal-btns {
    display: flex;
    gap: 8px;
  }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 700;
  }
  #cancelDel { background: #334155; color: white; }
  #confirmDel { background: #ef4444; color: white; }
  #confirmDel:disabled { background: #7f1d1d; opacity: 0.5; }

  /* Auth screen */
  #authScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .authBox {
    background: #1e293b;
    border-radius: 18px;
    padding: 28px 22px;
    width: 100%;
    max-width: 360px;
  }
  .authBox h1 {
    font-size: 22px;
    text-align: center;
    margin: 0 0 4px 0;
  }
  .authBox .tag {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .authBox input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 16px;
    margin-bottom: 10px;
  }
  .authBox button.primary {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #3b82f6;
    color: white;
    font-weight: 700;
    font-size: 16px;
    margin-top: 4px;
  }
  .switchMode {
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
    color: #94a3b8;
  }
  .switchMode a {
    color: #60a5fa;
    text-decoration: none;
    font-weight: 600;
  }
  .authError {
    background: #7f1d1d;
    color: #fecaca;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: none;
  }
  #appScreen { display: none; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="authBox">
    <h1>🏕️ $GY Counter</h1>
    <div class="tag">Sign in to access your camper list</div>
    <div class="authError" id="authError"></div>
    <input id="authEmail" type="email" placeholder="Email" autocapitalize="none" />
    <input id="authPassword" type="password" placeholder="Password" />
    <button class="primary" id="authSubmit">Log In</button>
    <div class="switchMode">
      <span id="switchText">No account?</span> <a href="#" id="switchLink">Sign up</a>
    </div>
  </div>
</div>

<!-- VERIFY EMAIL SCREEN -->
<div id="verifyScreen" style="display:none; min-height:100vh; align-items:center; justify-content:center; padding:20px;">
  <div class="authBox">
    <h1>📧 Check your email</h1>
    <div class="tag">We sent a verification link to <span id="verifyEmailAddr" style="color:#f1f5f9;"></span></div>
    <div class="authError" id="verifyError"></div>
    <button class="primary" id="iVerifiedBtn">I've verified — Continue</button>
    <div class="switchMode">
      <a href="#" id="resendLink">Resend email</a>
    </div>
    <div class="switchMode">
      <a href="#" id="verifyLogoutLink">Log out</a>
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="appScreen">
  <header>
    🏕️ $GY Counter
    <div class="subtitle" id="statusLine">loading...</div>
    <button id="logoutBtn">Log out</button>
  </header>

  <div id="list"></div>

  <div id="addBar">
    <input id="newName" placeholder="Add camper name..." />
    <button id="addBtn">Add</button>
  </div>

  <div id="delOverlay" class="overlay" style="display:none;">
    <div class="modal">
      <h3>Remove camper?</h3>
      <p id="delPrompt"></p>
      <input id="delInput" placeholder="Type name to confirm" autocapitalize="none" />
      <p style="font-size:12px;color:#64748b;margin-top:-6px;">Case-sensitive — must match exactly.</p>
      <div class="modal-btns">
        <button id="cancelDel">Cancel</button>
        <button id="confirmDel" disabled>Remove</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut, sendEmailVerification, reload
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBeLAjEl858UbzFRokiDQrTFe88tdkHC7o",
    authDomain: "gydollars-3ee66.firebaseapp.com",
    projectId: "gydollars-3ee66",
    storageBucket: "gydollars-3ee66.firebasestorage.app",
    messagingSenderId: "352231353369",
    appId: "1:352231353369:web:e8f8ca3a184c5866018e88",
    measurementId: "G-JWQ4884HDT"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ---- Elements ----
  const authScreen = document.getElementById('authScreen');
  const appScreen = document.getElementById('appScreen');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authSubmit = document.getElementById('authSubmit');
  const authError = document.getElementById('authError');
  const switchLink = document.getElementById('switchLink');
  const switchText = document.getElementById('switchText');
  const logoutBtn = document.getElementById('logoutBtn');

  const verifyScreen = document.getElementById('verifyScreen');
  const verifyEmailAddr = document.getElementById('verifyEmailAddr');
  const verifyError = document.getElementById('verifyError');
  const iVerifiedBtn = document.getElementById('iVerifiedBtn');
  const resendLink = document.getElementById('resendLink');
  const verifyLogoutLink = document.getElementById('verifyLogoutLink');

  const listEl = document.getElementById('list');
  const statusLine = document.getElementById('statusLine');
  const newNameInput = document.getElementById('newName');
  const addBtn = document.getElementById('addBtn');
  const delOverlay = document.getElementById('delOverlay');
  const delPrompt = document.getElementById('delPrompt');
  const delInput = document.getElementById('delInput');
  const cancelDel = document.getElementById('cancelDel');
  const confirmDel = document.getElementById('confirmDel');
  let pendingDeleteId = null;

  let isSignUpMode = false;
  let campers = []; // [{id, name, count}]
  let currentUid = null;

  // ---- Auth mode toggle ----
  switchLink.addEventListener('click', (e) => {
    e.preventDefault();
    isSignUpMode = !isSignUpMode;
    authSubmit.textContent = isSignUpMode ? 'Sign Up' : 'Log In';
    switchText.textContent = isSignUpMode ? 'Already have an account?' : 'No account?';
    switchLink.textContent = isSignUpMode ? 'Log in' : 'Sign up';
    authError.style.display = 'none';
  });

  function showAuthError(msg) {
    authError.textContent = msg;
    authError.style.display = 'block';
  }

  authSubmit.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) {
      showAuthError('Enter an email and password.');
      return;
    }
    authSubmit.disabled = true;
    authError.style.display = 'none';
    try {
      if (isSignUpMode) {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(cred.user);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (e) {
      showAuthError(friendlyAuthError(e.code));
    }
    authSubmit.disabled = false;
  });

  function friendlyAuthError(code) {
    switch (code) {
      case 'auth/email-already-in-use': return 'That email already has an account. Try logging in.';
      case 'auth/invalid-email': return 'That email address looks invalid.';
      case 'auth/weak-password': return 'Password should be at least 6 characters.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return 'Incorrect email or password.';
      default: return 'Something went wrong. Try again.';
    }
  }

  logoutBtn.addEventListener('click', () => signOut(auth));
  verifyLogoutLink.addEventListener('click', (e) => { e.preventDefault(); signOut(auth); });

  resendLink.addEventListener('click', async (e) => {
    e.preventDefault();
    verifyError.style.display = 'none';
    try {
      await sendEmailVerification(auth.currentUser);
      verifyError.style.display = 'block';
      verifyError.style.background = '#14532d';
      verifyError.style.color = '#bbf7d0';
      verifyError.textContent = 'Verification email sent again.';
    } catch (err) {
      verifyError.style.display = 'block';
      verifyError.style.background = '#7f1d1d';
      verifyError.style.color = '#fecaca';
      verifyError.textContent = 'Could not resend right now. Try again shortly.';
    }
  });

  iVerifiedBtn.addEventListener('click', async () => {
    if (!auth.currentUser) return;
    iVerifiedBtn.disabled = true;
    await reload(auth.currentUser);
    if (auth.currentUser.emailVerified) {
      campers = [];
      render();
      showScreen('app');
      await loadCampers();
    } else {
      verifyError.style.display = 'block';
      verifyError.style.background = '#7f1d1d';
      verifyError.style.color = '#fecaca';
      verifyError.textContent = 'Still not verified — check your inbox (and spam folder).';
    }
    iVerifiedBtn.disabled = false;
  });

  function showScreen(which) {
    authScreen.style.display = which === 'auth' ? 'flex' : 'none';
    verifyScreen.style.display = which === 'verify' ? 'flex' : 'none';
    appScreen.style.display = which === 'app' ? 'block' : 'none';
  }

  // ---- Auth state listener ----
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUid = user.uid;
      if (!user.emailVerified) {
        verifyEmailAddr.textContent = user.email;
        showScreen('verify');
        return;
      }
      campers = [];
      render();
      showScreen('app');
      await loadCampers();
    } else {
      currentUid = null;
      campers = [];
      showScreen('auth');
      authEmail.value = '';
      authPassword.value = '';
    }
  });

  // ---- Firestore load/save ----
  function setStatus(msg) {
    statusLine.textContent = msg;
  }

  async function loadCampers() {
    setStatus('loading...');
    try {
      const ref = doc(db, 'userData', currentUid);
      const snap = await getDoc(ref);
      campers = snap.exists() ? (snap.data().campers || []) : [];
    } catch (e) {
      campers = [];
      setStatus('load failed');
    }
    render();
    setStatus(campers.length + ' camper(s) tracked');
  }

  let saveChain = Promise.resolve();

  async function saveCampers() {
    const snapshot = campers.map(c => ({ ...c })); // freeze current state
    saveChain = saveChain.then(async () => {
      try {
        const ref = doc(db, 'userData', currentUid);
        await setDoc(ref, { campers: snapshot });
        setStatus('saved');
        setTimeout(() => setStatus(campers.length + ' camper(s) tracked'), 900);
      } catch (e) {
        setStatus('save failed — try again');
      }
    });
    return saveChain;
  }

  function render() {
    listEl.innerHTML = '';
    if (campers.length === 0) {
      listEl.innerHTML = '<div class="empty">No campers yet. Add one below 👇</div>';
      return;
    }
    campers.forEach(c => {
      const row = document.createElement('div');
      row.className = 'camper';
      row.innerHTML = `
        <div class="info">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="count">${c.count} camp $</div>
        </div>
        <div class="btns">
          <button class="step minus" data-id="${c.id}" data-action="minus">−</button>
          <button class="step plus" data-id="${c.id}" data-action="plus">+</button>
          <button class="del" data-id="${c.id}" data-action="del">✕</button>
        </div>
      `;
      listEl.appendChild(row);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    const camper = campers.find(c => c.id === id);
    if (!camper) return;

    if (action === 'plus') {
      camper.count++;
      render();
      saveCampers();
    } else if (action === 'minus') {
      if (camper.count > 0) camper.count--;
      render();
      saveCampers();
    } else if (action === 'del') {
      openDeleteModal(camper);
    }
  });

  function openDeleteModal(camper) {
    pendingDeleteId = camper.id;
    delPrompt.innerHTML = `Type <strong>${escapeHtml(camper.name)}</strong> exactly to remove them.`;
    delInput.value = '';
    confirmDel.disabled = true;
    delOverlay.style.display = 'flex';
    setTimeout(() => delInput.focus(), 50);
  }

  function closeDeleteModal() {
    delOverlay.style.display = 'none';
    pendingDeleteId = null;
  }

  delInput.addEventListener('input', () => {
    const camper = campers.find(c => c.id === pendingDeleteId);
    confirmDel.disabled = !camper || delInput.value.trim() !== camper.name;
  });
  delInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !confirmDel.disabled) confirmDel.click();
  });

  cancelDel.addEventListener('click', closeDeleteModal);

  confirmDel.addEventListener('click', () => {
    const camper = campers.find(c => c.id === pendingDeleteId);
    if (!camper || delInput.value.trim() !== camper.name) return;
    campers = campers.filter(c => c.id !== pendingDeleteId);
    closeDeleteModal();
    render();
    saveCampers();
  });

  function makeId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function addCamper() {
    const name = newNameInput.value.trim();
    if (!name) return;
    campers.push({ id: makeId(), name, count: 0 });
    newNameInput.value = '';
    render();
    saveCampers();
  }

  addBtn.addEventListener('click', addCamper);
  newNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addCamper();
  });

  authEmail.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') authSubmit.click();
  });
  authPassword.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') authSubmit.click();
  });
</script>

</body>
</html>
